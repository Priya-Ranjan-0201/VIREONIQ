name: Container Build, Trivy Scan & SBOM

on:
  push:
    branches: [ main, "improve/**", "hardening/**" ]
    paths:
      - 'backend/Dockerfile'
      - 'frontend/Dockerfile'
      - 'docker-compose*.yml'
      - '.github/workflows/containers.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-scan:
    name: Build, Scan & Attest Containers
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Frontend Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/vireoniq-frontend:${{ github.sha }}

      - name: Build Backend Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: ghcr.io/${{ github.repository_owner }}/vireoniq-backend:${{ github.sha }}

      - name: Trivy vulnerability scan (Backend)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/vireoniq-backend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Trivy vulnerability scan (Frontend)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/vireoniq-frontend:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Generate Backend SPDX SBOM
        uses: anchore/sbom-action@55dc4ee22412511ee8c3142cbea40418e6cec693 # v0.17.8
        with:
          image: ghcr.io/${{ github.repository_owner }}/vireoniq-backend:${{ github.sha }}
          output-file: backend-sbom.spdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-artifacts
          path: backend-sbom.spdx.json

      - name: Smoke test production backend container health
        run: |
          docker run -d --name vireoniq-smoke -p 18000:8000 \
            -e ENVIRONMENT=test \
            -e SECRET_KEY=ci-smoke-secret-key-not-for-prod-0001 \
            -e CREDENTIAL_SIGNING_KEY=ci-smoke-cred-key-not-for-prod-0001 \
            -e DATABASE_URL=sqlite+aiosqlite:///./smoke.db \
            ghcr.io/${{ github.repository_owner }}/vireoniq-backend:${{ github.sha }}
          sleep 6
          curl -sf http://127.0.0.1:18000/health
          curl -sf http://127.0.0.1:18000/metrics | grep -q vireoniq_http_requests_total
          docker rm -f vireoniq-smoke

      - name: Push & attest Backend image on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vireoniq-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/vireoniq-backend:latest
          provenance: true
