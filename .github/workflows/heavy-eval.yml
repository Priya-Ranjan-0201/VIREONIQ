name: Heavy Evaluation, Red-Team & Load Checks

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0' # Weekly Sunday 03:00 UTC

permissions:
  contents: read

jobs:
  heavy-suite:
    name: Benchmark, Evaluation Harness, Red-Team & Determinism
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      ENVIRONMENT: test
      SECRET_KEY: heavy-eval-ci-secret-not-for-production-use

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full evaluation harness and red-team suite
        run: |
          cd backend
          python -m eval.run_baseline_suite

      - name: Run benchmark-marked backend tests
        run: |
          cd backend
          pytest -m benchmark -v

      - name: Multi-run determinism verification (3 consecutive runs)
        run: |
          cd backend
          for i in 1 2 3; do
            echo "Determinism pass $i"
            pytest tests/test_scoring_properties.py tests/test_redteam.py tests/test_rag_and_model_gate.py -q
          done

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@ea165f8d5f8d8e4e02c9443e05f181f29a8f1030 # v4
        with:
          name: eval-and-redteam-reports
          path: docs/evals/
