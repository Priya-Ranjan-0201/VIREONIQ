name: Playwright UI Smoke & Accessibility

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths: [ 'frontend/**' ]

permissions:
  contents: read

jobs:
  playwright-smoke:
    name: Playwright Smoke & Screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies and Playwright Chromium
        run: |
          cd frontend
          npm ci
          npm install --no-save @playwright/test
          npx playwright install chromium

      - name: Build production frontend
        run: |
          cd frontend
          npm run build

      - name: Run Playwright smoke tests
        run: |
          cd frontend
          npx playwright test

      - name: Upload Playwright screenshots & report
        if: always()
        uses: actions/upload-artifact@ea165f8d5f8d8e4e02c9443e05f181f29a8f1030 # v4
        with:
          name: playwright-ui-artifacts
          path: frontend/playwright-report/
