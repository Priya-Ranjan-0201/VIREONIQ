[project]
name = "vireoniq-backend"
version = "0.9.0"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = [".venv", "alembic", "__pycache__"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["^.venv/", "^alembic/"]

# db/models.py uses SQLAlchemy 1.x Column(...) descriptors (not Mapped[...]),
# producing Column[T] vs T noise across ORM-consuming packages.
# Keep core.*, schemas.*, and db.* strict; keep call-arg, attr-defined,
# name-defined, misc, dict-item, and syntax enforced across all packages.
[[tool.mypy.overrides]]
module = [
    "main",
    "api.*",
    "crud.*",
    "services.*",
    "workers.*",
    "scripts.*",
    "tests.*",
]
disable_error_code = [
    "arg-type",
    "assignment",
    "operator",
    "index",
    "union-attr",
    "return-value",
    "call-overload",
    "var-annotated",
    "list-item",
]

[tool.pyrefly]
project-includes = ["."]
project-excludes = [".venv", "**/__pycache__"]
python-version = "3.12.0"
