services:
  postgres:
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    ports:
      - "127.0.0.1:6379:6379"

  mongodb:
    ports:
      - "127.0.0.1:27017:27017"

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"

  backend:
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development
