services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-changeme_dev_only}", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"

  mongodb:
    environment:
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-changeme_dev_only}
    ports:
      - "127.0.0.1:27017:27017"

  qdrant:
    ports:
      - "127.0.0.1:6333:6333"

  backend:
    ports:
      - "127.0.0.1:8000:8000"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - ENVIRONMENT=development
